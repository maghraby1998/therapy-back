scalar DateTime

enum UserRole {
  PATIENT
  DOCTOR
}

enum DoctorVerificationStatus {
  PENDING
  UNDER_REVIEW
  APPROVED
  REJECTED
}

enum SessionStatus {
  PENDING
  CONFIRMED
  COMPLETED
  CANCELLED
}

type DoctorCertificate {
  id: ID!
  title: String!
  issuer: String
  fileUrl: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PatientProfile {
  id: ID!
  fullName: String
  dateOfBirth: DateTime
  gender: String
  emergencyContactName: String
  emergencyContactPhone: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DoctorProfile {
  id: ID!
  fullName: String
  specialty: String
  bio: String
  yearsOfExperience: Int
  licenseNumber: String
  verificationStatus: DoctorVerificationStatus!
  certificates: [DoctorCertificate!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type User {
  id: ID!
  email: String!
  phone: String!
  role: UserRole!
  isActive: Boolean!
  isEmailVerified: Boolean!
  isPhoneVerified: Boolean!
  profileCompletedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  patientProfile: PatientProfile
  doctorProfile: DoctorProfile
}

type Session {
  id: ID!
  patient: User!
  doctor: User!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
  status: SessionStatus!
  roomName: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type VideoCallRoom {
  roomName: String!
  token: String!
  sessionId: ID!
}

type AuthPayload {
  accessToken: String!
  tokenType: String!
  user: User!
}

input RegisterInput {
  email: String!
  phone: String!
  password: String!
  role: UserRole!
}

input LoginInput {
  emailOrPhone: String!
  password: String!
}

input BookSessionInput {
  doctorId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
}

input UpdateSessionStatusInput {
  sessionId: ID!
  status: SessionStatus!
}

type Query {
  me: User!
  mySessions: [Session!]!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  bookSession(input: BookSessionInput!): Session!
  updateSessionStatus(input: UpdateSessionStatusInput!): Session!
  startVideoCall(sessionId: ID!): VideoCallRoom!
  joinVideoCall(sessionId: ID!): VideoCallRoom!
}
