scalar DateTime

enum UserRole {
  PATIENT
  DOCTOR
  ADMIN
}

enum DoctorVerificationStatus {
  PENDING
  UNDER_REVIEW
  APPROVED
  REJECTED
}

type DoctorVerificationDocumentType {
  id: ID!
  name: String!
  description: String
  isRequired: Boolean!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DoctorCertificate {
  id: ID!
  title: String!
  issuer: String
  fileUrl: String!
  notes: String
  documentType: DoctorVerificationDocumentType
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PatientProfile {
  id: ID!
  fullName: String
  dateOfBirth: DateTime
  gender: String
  emergencyContactName: String
  emergencyContactPhone: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DoctorProfile {
  id: ID!
  fullName: String
  specialty: String
  bio: String
  yearsOfExperience: Int
  licenseNumber: String
  verificationStatus: DoctorVerificationStatus!
  hasSubmittedRequiredDocuments: Boolean!
  visibleInSearch: Boolean!
  certificates: [DoctorCertificate!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type User {
  id: ID!
  email: String!
  phone: String!
  role: UserRole!
  isActive: Boolean!
  isEmailVerified: Boolean!
  isPhoneVerified: Boolean!
  profileCompletedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  patientProfile: PatientProfile
  doctorProfile: DoctorProfile
}

type AuthPayload {
  accessToken: String!
  tokenType: String!
  user: User!
}

input RegisterInput {
  name: String!
  email: String!
  phone: String!
  password: String!
  role: UserRole!
}

input LoginInput {
  emailOrPhone: String!
  password: String!
}

input UpsertDoctorVerificationDocumentTypeInput {
  id: ID
  name: String!
  description: String
  isRequired: Boolean!
  isActive: Boolean!
}

input SubmitDoctorVerificationDocumentInput {
  documentTypeId: ID!
  fileUrl: String!
  issuer: String
  notes: String
}

input ReviewDoctorVerificationInput {
  doctorProfileId: ID!
  status: DoctorVerificationStatus!
}

type Query {
  me: User!
  doctors: [DoctorProfile]
  verificationDocumentTypes(includeInactive: Boolean): [DoctorVerificationDocumentType!]!
  mySubmittedCertificates: [DoctorCertificate!]!
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  upsertDoctorVerificationDocumentType(
    input: UpsertDoctorVerificationDocumentTypeInput!
  ): DoctorVerificationDocumentType!
  submitDoctorVerificationDocument(
    input: SubmitDoctorVerificationDocumentInput!
  ): DoctorCertificate!
  reviewDoctorVerification(input: ReviewDoctorVerificationInput!): DoctorProfile!
}
