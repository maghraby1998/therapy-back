enum SessionStatus {
  PENDING
  CONFIRMED
  COMPLETED
  CANCELLED
}

type Session {
  id: ID!
  patient: User!
  doctor: User!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
  status: SessionStatus!
  roomName: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum DayOfWeek {
  SUNDAY
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
}

enum ScheduleStatus {
  WORKING
  DAY_OFF
  VACATION
}

type ScheduleSlot {
  id: ID!
  dayOfWeek: DayOfWeek!
  startTime: String!
  endTime: String!
}

type DoctorSchedule {
  id: ID!
  startsAt: DateTime!
  status: ScheduleStatus!
  slots: [ScheduleSlot!]!
}

type TimeSlot {
  startTime: DateTime!
  endTime: DateTime!
}

input ScheduleSlotInput {
  dayOfWeek: DayOfWeek!
  startTime: String!
  endTime: String!
}

input CreateScheduleInput {
  startsAt: DateTime!
  status: ScheduleStatus!
  slots: [ScheduleSlotInput!]
}

type Mutation {
  bookSession(input: BookSessionInput!): Session!
  updateSessionStatus(input: UpdateSessionStatusInput!): Session!
  startVideoCall(sessionId: ID!): VideoCallRoom!
  joinVideoCall(sessionId: ID!): VideoCallRoom!
  createSchedule(input: CreateScheduleInput!): DoctorSchedule!
  deleteSchedule(scheduleId: ID!): Boolean!
  updateSessionDuration(minutes: Int!): DoctorProfile!
}

type Query {
  mySessions: [Session!]!
  freeSlots(doctorId: ID!, date: DateTime!): [TimeSlot!]!
  mySchedules: [DoctorSchedule!]!
}

input UpdateSessionStatusInput {
  sessionId: ID!
  status: SessionStatus!
}

input BookSessionInput {
  doctorId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
}

type VideoCallRoom {
  roomName: String!
  token: String!
  sessionId: ID!
}
